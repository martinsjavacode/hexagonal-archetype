spring:
  application:
    name: ${artifactId}
  r2dbc:
    url: r2dbc:h2:mem:///testdb
    username: sa
    password: 
  h2:
    console:
      enabled: true
  flyway:
    url: jdbc:h2:mem:testdb
    user: sa
    password: 
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  metrics:
    export:
      dynatrace:
        enabled: true
        api-token: '${DYNATRACE_API_TOKEN}'
        uri: '${DYNATRACE_URI}'
        device-id: ${artifactId}
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true

# OpenTelemetry Configuration for Dynatrace
otel:
  service:
    name: ${artifactId}
    version: ${version}
  exporter:
    otlp:
      endpoint: '${DYNATRACE_OTLP_ENDPOINT}'
      headers:
        Authorization: 'Api-Token ${DYNATRACE_API_TOKEN}'
      protocol: grpc
  traces:
    exporter: otlp
  metrics:
    exporter: otlp
  logs:
    exporter: otlp
  instrumentation:
    spring-webflux:
      enabled: true
    r2dbc:
      enabled: true
    micrometer:
      enabled: true

logging:
  level:
    ${package}: DEBUG
    org.springframework.r2dbc: DEBUG
    io.opentelemetry: INFO
