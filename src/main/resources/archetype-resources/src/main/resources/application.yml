spring:
  r2dbc:
    url: r2dbc:h2:mem:///testdb
    username: sa
    password: 
  h2:
    console:
      enabled: true
  flyway:
    url: jdbc:h2:mem:testdb
    user: sa
    password: 
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    ${package}: DEBUG
    org.springframework.r2dbc: DEBUG
